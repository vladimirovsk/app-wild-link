<div class="map-wrap">
  <div #mapContainer class="leaflet-map-container"></div>

  <!-- Node info card -->
  <div class="device-card" *ngIf="selectedNode as n">
    <button class="device-card__close" (click)="closeInfo()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="device-card__id">{{ n.id }}<span *ngIf="n.isSelf"> · this device</span></div>
    <div class="device-card__name">{{ label(n) }}</div>

    <div class="device-card__meta">
      <div class="meta-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/>
        </svg>
        <span *ngIf="n.externalPower">Powered</span>
        <span *ngIf="!n.externalPower">{{ n.battery !== undefined ? n.battery + '%' : '—' }}</span>
        <span *ngIf="n.voltage" class="meta-sub">{{ n.voltage | number:'1.2-3' }}V</span>
      </div>

      <div class="meta-item" *ngIf="n.alt !== undefined || n.hopsAway !== undefined">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
        <span *ngIf="n.alt !== undefined">{{ n.alt }} m</span>
        <span *ngIf="n.hopsAway !== undefined" class="meta-sub">{{ n.hopsAway }} hop(s)</span>
      </div>

      <div class="meta-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>{{ formatLastHeard(n) }}</span>
      </div>
    </div>

    <div class="device-card__coords" *ngIf="n.lat !== undefined && n.lng !== undefined">
      {{ n.lat.toFixed(5) }},&nbsp;{{ n.lng.toFixed(5) }}
    </div>
  </div>

  <!-- Map controls -->
  <div class="map-controls">
    <button class="map-btn" (click)="zoomIn()"  title="Zoom in">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
    <div class="map-btn-divider"></div>
    <button class="map-btn" (click)="zoomOut()" title="Zoom out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
    <div class="map-btn-divider"></div>
    <button class="map-btn" (click)="fitDevices()" title="Fit all devices">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M11 8v6M8 11h6"/>
        <line x1="16.5" y1="16.5" x2="22" y2="22"/>
      </svg>
    </button>
  </div>

  <!-- Legend -->
  <div class="map-legend">
    <div class="legend-item"><span class="legend-dot legend-dot--online"></span>Heard recently</div>
    <div class="legend-item"><span class="legend-dot legend-dot--offline"></span>Not heard for 15 min</div>
  </div>
</div>
