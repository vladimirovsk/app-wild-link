<div class="sc-shell">

  <!-- ── Toolbar ─────────────────────────────── -->
  <div class="sc-toolbar">
    <div class="sc-toolbar__controls">
      <div class="sc-status-dot" [class]="'dot--' + (status === 'connected' ? 'open' : status)" [title]="status"></div>
      <span class="sc-portinfo__status">{{ status }}</span>

      <button class="btn btn--ghost" title="Clear log" (click)="clearConsole()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>
        </svg>
        Clear
      </button>

      <label class="sc-autoscroll">
        <input type="checkbox" [(ngModel)]="autoScroll" />
        <span>Auto-scroll</span>
      </label>
    </div>
  </div>

  <!-- ── Device log ──────────────────────────── -->
  <div class="sc-console" #consoleEl>
    <div *ngIf="lines.length === 0" class="sc-console__empty">
      Device log appears here once the device is connected (<strong>Connect device</strong> at the top).
      The firmware sends log lines to the app only when <strong>Debug log API</strong> is enabled in the device's security settings.
    </div>

    <div *ngFor="let l of lines" class="sc-line sc-line--rx">
      <span class="sc-line__ts">{{ l.at | date:'HH:mm:ss' }}</span>
      <span class="sc-line__dir">{{ l.source || '·' }}</span>
      <span class="sc-line__text">{{ l.message }}</span>
    </div>
  </div>

</div>
